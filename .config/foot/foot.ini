# ══════════════════════════════════════════════
#  ⚡ Foot Terminal — Tokyo Night Full Rice
# ══════════════════════════════════════════════

[main]
font=JetBrainsMono Nerd Font Mono:size=30
font-bold=JetBrainsMono Nerd Font Mono:size=30:weight=bold
font-italic=JetBrainsMono Nerd Font Mono:size=30:slant=italic
font-bold-italic=JetBrainsMono Nerd Font Mono:size=30:weight=bold:slant=italic
pad=30x30 center
dpi-aware=yes
initial-window-size-pixels=1600x900
selection-target=both
bold-text-in-bright=yes
underline-thickness=2px

[bell]
urgent=no
notify=no
visual=no

[cursor]
style=beam
blink=yes
beam-thickness=2

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[url]
launch=xdg-open ${url}

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative

[csd]
preferred=none
size=0

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
search-start=Control+Shift+f

[colors]
alpha=0.85
background=1a1b26
foreground=c0caf5
flash=f7768e
selection-foreground=c0caf5
selection-background=283457
cursor=1a1b26 f7768e

