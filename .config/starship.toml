# ══════════════════════════════════════════════
#  ⚡ Starship Prompt — Tokyo Night Rounded Rice
# ══════════════════════════════════════════════

format = """
[](fg:#7aa2f7)\
$os\
$username\
[](fg:#7aa2f7) \
[](fg:#bb9af7)\
$directory\
[](fg:#bb9af7)\
 $git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$lua\
$cmd_duration\
$status\
$fill\
[](fg:#414868)\
$memory_usage\
[](fg:#414868)[](fg:#565f89)\
$time\
[](fg:#565f89)\
\n$character"""

add_newline = true

# ── Левая сторона ────────────────────────────

[os]
disabled = false
style = "bg:#7aa2f7 fg:#1a1b26"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇"
Linux = ""

[username]
show_always = true
style_user = "bg:#7aa2f7 fg:#1a1b26 bold"
style_root = "bg:#f7768e fg:#1a1b26 bold"
format = "[$user ]($style)"

[directory]
style = "bg:#bb9af7 fg:#1a1b26 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "bg:#bb9af7 fg:#f7768e"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰎆 "
"Pictures" = " "
"Videos" = "󰕧 "
"Projects" = "󰲋 "
".config" = " "

[git_branch]
symbol = ""
style = "fg:#9ece6a bold"
format = "[  $symbol $branch ]($style)"

[git_status]
style = "fg:#9ece6a"
format = "[$all_status$ahead_behind]($style)"
conflicted = "󰘬 "
ahead = "󰁝${count} "
behind = "󰁅${count} "
diverged = "󰃻 ${ahead_count}/${behind_count} "
untracked = "󰋗${count} "
stashed = "󰏗 "
modified = "󰏫${count} "
staged = "󰐕${count} "
renamed = "󰑕 "
deleted = "󰍷${count} "

[python]
symbol = ""
style = "fg:#e0af68 bold"
format = "[ $symbol $version( \\($virtualenv\\)) ]($style)"
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version"]
detect_folders = ["venv", ".venv"]
detect_env_vars = ["VIRTUAL_ENV"]

[nodejs]
symbol = ""
style = "fg:#e0af68 bold"
format = "[ $symbol $version ]($style)"
detect_extensions = ["js", "ts", "mjs"]
detect_files = ["package.json", ".node-version"]

[rust]
symbol = "󱘗"
style = "fg:#e0af68 bold"
format = "[ $symbol $version ]($style)"

[golang]
symbol = "󰟓"
style = "fg:#e0af68 bold"
format = "[ $symbol $version ]($style)"

[lua]
symbol = "󰢱"
style = "fg:#e0af68 bold"
format = "[ $symbol $version ]($style)"

[cmd_duration]
min_time = 500
style = "fg:#f7768e bold"
format = "[ 󰔟 $duration ]($style)"
show_milliseconds = false

[status]
disabled = false
style = "fg:#f7768e bold"
format = "[ 󰅙 $status ]($style)"
symbol = "󰅙 "
success_symbol = ""
not_executable_symbol = "󰂭 "
not_found_symbol = "󰍉 "
sigint_symbol = "󰓛 "
map_symbol = true

# ── Заполнитель ──────────────────────────────

[fill]
symbol = " "

# ── Правая сторона ───────────────────────────

[memory_usage]
disabled = false
threshold = 0
style = "bg:#414868 fg:#c0caf5"
format = "[ 󰍛 $ram_pct ]($style)"

[time]
disabled = false
style = "bg:#565f89 fg:#c0caf5"
format = "[ 󰥔 $time ]($style)"
time_format = "%H:%M"

# ── Символ ввода ─────────────────────────────

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #7aa2f7)"
